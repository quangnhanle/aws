# Hạ tầng local (Phase 0)
# Chạy:  docker compose up -d   |   Tắt: docker compose down (-v để xoá data)
services:
  postgres:                          # 1 instance chứa 2 DB: orders_db + products_db
    image: postgres:16
    container_name: aws-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 10

  jenkins:                           # CI server (chạy pipeline trong Jenkinsfile)
    build:
      context: ./docker/jenkins      # dùng Dockerfile cài sẵn Maven + JDK 21
    container_name: aws-jenkins
    ports:
      - "8080:8080"                  # Web UI  (services đang dùng 8081/8082)
      - "50000:50000"                # cổng kết nối cho inbound agents
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped

volumes:
  pgdata:
  jenkins_home:
